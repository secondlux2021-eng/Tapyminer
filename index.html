<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tapyminer Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Стиль зоряного неба */
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
            color: white;
            font-family: 'Segoe UI', Roboto, sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Ефект зірок-діамантів */
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: 
                radial-gradient(1px 1px at 20px 30px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 90px 40px, #00d2ff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, #ff00ff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            opacity: 0.5;
        }

        .container { padding: 20px; text-align: center; }

        .balance-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 30px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .balance-val { font-size: 3.5rem; font-weight: 800; color: #f39c12; text-shadow: 0 0 20px rgba(243, 156, 18, 0.5); margin: 10px 0; }

        /* Сітка кнопок */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .menu-item {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 15px;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background 0.2s;
            text-decoration: none;
            color: white;
        }

        .menu-item:active { transform: scale(0.95); background: rgba(255, 255, 255, 0.15); }
        .icon { font-size: 1.5rem; margin-bottom: 8px; }

        .main-btn {
            grid-column: span 2;
            background: linear-gradient(45deg, #f39c12, #e67e22);
            color: black;
            font-weight: bold;
            padding: 20px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <div class="stars-container"></div>
    
    <div class="container">
        <div class="balance-card">
            <div style="text-transform: uppercase; letter-spacing: 2px; font-size: 0.8rem; opacity: 0.7;">Баланс</div>
            <div class="balance-val" id="balance">0.0000</div>
            <div style="color: #2ecc71;">⚡ +10.0 м/год</div>
        </div>

        <div class="menu-grid">
            <a href="#" class="menu-item main-btn" onclick="claim()">
                <span class="icon">💰</span> ЗАБРАТИ МОНЕТИ
            </a>
            <a href="#" class="menu-item">
                <span class="icon">📈</span> РІВЕНЬ
            </a>
            <a href="#" class="menu-item">
                <span class="icon">🧩</span> ЗАГАДКА
            </a>
            <a href="#" class="menu-item">
                <span class="icon">🎡</span> КОЛЕСО
            </a>
            <a href="#" class="menu-item">
                <span class="icon">📝</span> ЗАВДАННЯ
            </a>
            <a href="#" class="menu-item">
                <span class="icon">🛒</span> МАГАЗИН
            </a>
            <a href="#" class="menu-item">
                <span class="icon">👥</span> ДРУЗІ
            </a>
            <a href="#" class="menu-item">
                <span class="icon">📜</span> ІСТОРІЯ
            </a>
            <a href="#" class="menu-item">
                <span class="icon">👛</span> ГАМАНЕЦЬ
            </a>
            <a href="#" class="menu-item" style="grid-column: span 2;">
                <span class="icon">🏆</span> ЛІДЕРБОРД
            </a>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.headerColor = '#1B2735';

        function claim() {
            tg.HapticFeedback.impactOccurred('medium');
            // Тут буде логіка збору
        }
    </script>
</body>
</html>
