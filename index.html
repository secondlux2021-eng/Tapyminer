<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background: #090A0F; color: white; font-family: sans-serif; text-align: center; }
        .card { background: rgba(255,255,255,0.05); border-radius: 20px; padding: 20px; margin: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .val { font-size: 2.5rem; color: #f39c12; font-weight: bold; margin: 10px 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 15px; }
        .btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 12px; cursor: pointer; color: #ccc; }
        .main { background: rgba(243, 156, 18, 0.2); color: #f39c12; border: 1px solid #f39c12; font-weight: bold; margin-bottom: 15px; width: calc(100% - 30px); margin-left: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <div style="font-size: 0.7rem; opacity: 0.6;">БАЛАНС TAPY</div>
        <div class="val" id="display">0.000000</div>
    </div>

    <button class="btn main" onclick="sendToBot('claim')">💰 ЗАБРАТИ TAPY</button>

    <div class="grid">
        <div class="btn" onclick="sendToBot('level')">РІВЕНЬ</div>
        <div class="btn" onclick="sendToBot('shop')">МАГАЗИН</div>
        <div class="btn" onclick="sendToBot('tasks')">ЗАВДАННЯ</div>
        <div class="btn" onclick="sendToBot('wheel')">КОЛЕСО</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready(); // Повідомляємо Telegram, що ми готові

        let current = 0.0;
        setInterval(() => {
            current += 10.0 / 3600;
            document.getElementById('display').innerText = current.toFixed(6);
        }, 1000);

        function sendToBot(actionName) {
            try {
                tg.HapticFeedback.impactOccurred('medium');
                
                let payload = JSON.stringify({
                    action: actionName,
                    amount: current.toFixed(6)
                });

                // ОСНОВНА КОМАНДА
                tg.sendData(payload);
                
            } catch (e) {
                alert("Помилка відправки: " + e);
            }
        }
    </script>
</body>
    </html>
