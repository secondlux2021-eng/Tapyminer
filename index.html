<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0; padding: 0;
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
            color: white; font-family: 'Segoe UI', sans-serif;
            overflow: hidden; min-height: 100vh;
        }

        .stars {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background-image: 
                radial-gradient(1px 1px at 20px 30px, #fff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 150px 150px, #00d2ff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 250px 300px, #ff00ff, rgba(0,0,0,0));
            background-size: 300px 300px;
        }

        /* ВЕРХНЯ ПАНЕЛЬ */
        .top-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 15px 20px; background: rgba(255,255,255,0.03); backdrop-filter: blur(5px);
        }

        .level-circle {
            width: 40px; height: 40px; border-radius: 50%;
            background: #f39c12; color: black; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px rgba(243, 156, 18, 0.4);
        }

        .progress-container {
            flex-grow: 1; margin: 0 15px; height: 8px;
            background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden;
        }

        .progress-fill { width: 45%; height: 100%; background: #f39c12; }

        .multi-balance { text-align: right; font-size: 0.75rem; line-height: 1.4; opacity: 0.9; }
        .multi-balance span { color: #f39c12; font-weight: bold; }

        /* ОСНОВНИЙ КОНТЕНТ */
        .content { padding: 20px; margin-top: 20px; }

        .mining-card {
            background: rgba(255, 255, 255, 0.05); border-radius: 25px;
            padding: 25px; border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 25px;
        }

        .tapy-val { font-size: 3.2rem; font-weight: 800; color: #f39c12; margin: 10px 0; }

        /* КНОПКИ */
        .btn-claim {
            background: #f39c12; color: black; font-weight: bold;
            padding: 18px; border-radius: 18px; margin-bottom: 20px;
            cursor: pointer; display: block; border: none; width: 100%; font-size: 1.1rem;
        }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .item {
            background: rgba(255, 255, 255, 0.03); /* МАЙЖЕ НЕПОМІТНІ */
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 15px; padding: 15px; font-size: 0.85rem;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s;
        }

        .item:active { background: rgba(255, 255, 255, 0.1); transform: scale(0.96); }

        .full-width { grid-column: span 2; }
    </style>
</head>
<body>
    <div class="stars"></div>

    <div class="top-bar">
        <div class="level-circle" id="lvl">1</div>
        <div class="progress-container">
            <div class="progress-fill"></div>
        </div>
        <div class="multi-balance">
            <div>TON: <span>0.00</span></div>
            <div>STARS: <span>0</span></div>
            <div>TAPY: <span id="total-tapy">125.5</span></div>
        </div>
    </div>

    <div class="content">
        <div class="mining-card">
            <div style="opacity: 0.6; font-size: 0.8rem; letter-spacing: 1px;">БАЛАНС TAPY</div>
            <div class="tapy-val" id="mining-balance">0.000000</div>
            <div style="color: #2ecc71; font-size: 0.9rem;">⚡ +10.0 Tapy/год</div>
        </div>

        <button class="btn-claim" onclick="sendAction('claim')">💰 ЗАБРАТИ TAPY</button>

        <div class="grid">
            <div class="item" onclick="sendAction('level')">📈 РІВЕНЬ</div>
            <div class="item" onclick="sendAction('shop')">🛒 МАГАЗИН</div>
            <div class="item" onclick="sendAction('tasks')">📝 ЗАВДАННЯ</div>
            <div class="item" onclick="sendAction('wheel')">🎡 КОЛЕСО</div>
            <div class="item" onclick="sendAction('riddle')">🧩 ЗАГАДКА</div>
            <div class="item" onclick="sendAction('friends')">👥 ДРУЗІ</div>
            <div class="item" onclick="sendAction('history')">📜 ІСТОРІЯ</div>
            <div class="item" onclick="sendAction('wallet')">👛 ГАМАНЕЦЬ</div>
            <div class="item full-width" onclick="sendAction('leaderboard')">🏆 ЛІДЕРБОРД</div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let currentMining = 0.0;
        let rate = 10.0;

        // Майнінг
        setInterval(() => {
            currentMining += rate / 3600;
            document.getElementById('mining-balance').innerText = currentMining.toFixed(6);
        }, 1000);

        function sendAction(actionType) {
            tg.HapticFeedback.impactOccurred('medium');
            
            // Пакет даних для бота
            let payload = {
                action: actionType,
                amount: currentMining.toFixed(6)
            };

            // ВАЖЛИВО: tg.sendData працює ТІЛЬКИ якщо Mini App відкритий через кнопку InlineKeyboardMarkup
            // Він закриває вікно і відправляє дані.
            tg.sendData(JSON.stringify(payload));
        }
    </script>
</body>
</html>
